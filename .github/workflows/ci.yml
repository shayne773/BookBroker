name: CI

on:
  push:
    branches: ['master']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Generated by `no-mistakes ci-workflow`, whose template assumes Go: the Go
      # setup is replaced by Node, and the Install step runs commands.prepare from
      # .no-mistakes.yaml. The Lint and Test commands are that file's, verbatim.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # The back-end tests download a mongod binary on first use (mongodb-memory-server).
      - uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('back-end/package.json') }}

      - name: Install
        run: |
          npm --prefix front-end install && npm --prefix back-end install

      - name: Lint
        run: |
          npm --prefix front-end run lint

      - name: Test
        run: |
          npm --prefix front-end run build && npm --prefix front-end test && npm --prefix back-end test
